# Windows-Installer für ein Release: baut bei jedem Tag vX.Y.Z den NSIS-Installer (Weitergabe-Build, ohne
# Entwickler-Code) und hängt ihn samt SHA-256 an das GitHub-Release dieses Tags. Gibt es noch keins, wird ein
# Entwurf angelegt; das macOS-DMG kommt über scripts/release.sh dazu. Veröffentlicht wird nie automatisch.
#
# Signatur über SignPath (kostenlos für Open Source, Zertifikat der SignPath Foundation), nur wenn das Secret
# SIGNPATH_API_TOKEN und die Variable SIGNPATH_ORGANIZATION_ID gesetzt sind; sonst bleibt der Installer
# unsigniert. Ablauf, jeder Schritt in einem eigenen Job:
#   windows         baut App und Installer, ohne jeden Signatur-Zugang
#   sign-app        SignPath signiert knips.exe (wartet auf die Freigabe in SignPath)
#   bundle          baut den Installer neu um die signierte knips.exe (SignPath kann NSIS nicht von innen signieren)
#   sign-installer  SignPath signiert den Installer (zweite Freigabe)
#   updater         signiert den endgültigen Installer mit dem Updater-Schlüssel, erzeugt latest.json (Feed der
#                   automatischen Aktualisierung) und prüft sie mit dem öffentlichen Schlüssel aus tauri.conf.json
#   publish         prüft Signaturen, Prüfsumme und latest.json, hängt die Dateien an das Release
# Der API-Token steht nur als Eingabe der SignPath-Action in den beiden Signier-Jobs, die nichts bauen und
# keinen Code auschecken; der Updater-Schlüssel (Secret TAURI_SIGNING_PRIVATE_KEY, ggf. mit …_PASSWORD) nur im
# Signierschritt des Jobs „updater“, der nichts baut und nichts hochlädt; GH_TOKEN nur im Schritt, der ans Release
# hängt. Fehlt der Updater-Schlüssel, bricht der Lauf gleich am Anfang ab. Einrichtung: RELEASING.md.
#
# Variablen (Settings → Secrets and variables → Actions → Variables): SIGNPATH_ORGANIZATION_ID,
# SIGNPATH_PROJECT_SLUG (Standard knips), SIGNPATH_SIGNING_POLICY_SLUG (Standard release-signing; enthält der
# Name „test“, z. B. test-signing, ist es ein Probelauf: signiert mit dem Testzertifikat, hängt nichts ans Release).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandenes Tag, z. B. v1.0.0 (für signierte Läufe den Lauf auch auf dem Tag starten: --ref v1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Jeder Job bekommt nur, was er braucht.
permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Gleicher Job-Name wie in windows.yml: der Rust-Cache von main wird wiederverwendet.
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.signing.outputs.enabled }}
      test-signing: ${{ steps.signing.outputs.test }}
      project: ${{ steps.signing.outputs.project }}
      policy: ${{ steps.signing.outputs.policy }}
      exe-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          # Ganze Historie: die Build-Nummer ist wie auf dem Mac (scripts/build.sh) die Zahl der Commits.
          fetch-depth: 0
          persist-credentials: false

      # Ohne Updater-Schlüssel gäbe es keine latest.json — installierte Fassungen fänden die neue Version nie.
      # Deshalb vor 20 Minuten Bauen prüfen (nur ob er gesetzt ist; der Schlüssel selbst kommt nie in diesen Job).
      - name: Updater-Schlüssel eingerichtet?
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if ($env:HAS_UPDATER_KEY -ne 'true') {
            # In '…': PowerShell läse „ und “ sonst als Anführungszeichen.
            throw 'Secret TAURI_SIGNING_PRIVATE_KEY fehlt: Ohne den Updater-Schlüssel entsteht keine latest.json, und installierte Fassungen fänden das Update nicht. Einrichtung: RELEASING.md, Abschnitt „Automatische Updates (Windows)“.'
          }

      - name: Version aus dem Tag, Build-Nummer aus der Historie
        id: version
        run: |
          if ($env:TAG -match '^v(\d+\.\d+\.\d+)$') { $version = $Matches[1] }
          else { throw "Tag '$env:TAG' hat nicht die Form vX.Y.Z." }
          $build = (git rev-list --count HEAD).Trim()
          if (-not ($build -match '^\d+$')) { throw "Build-Nummer nicht ermittelbar: '$build'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          Write-Host "Knips $version (Build $build)"

      # Nur ob die Zugänge gesetzt sind — der Token selbst kommt nie in diesen Job.
      - name: Signatur über SignPath eingerichtet?
        id: signing
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG || 'knips' }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          RUN_REF: ${{ github.ref }}
        run: |
          if ($env:HAS_TOKEN -eq 'true' -and $env:ORGANIZATION) {
            # SignPath prüft die Herkunft am Lauf (Repo, Commit, Ref). Der Lauf muss deshalb auf dem Tag laufen,
            # das gebaut wird — bei workflow_dispatch also mit --ref vX.Y.Z.
            if ($env:RUN_REF -ne "refs/tags/$env:TAG") {
              throw "Signierte Läufe müssen auf dem Tag laufen: gh workflow run release.yml --ref $env:TAG -f tag=$env:TAG (läuft auf $env:RUN_REF)."
            }
            # Testzertifikat (Richtlinie mit „test“ im Namen): signieren und prüfen, aber nichts ans Release hängen.
            $test = $env:POLICY -match 'test'
            "enabled=true" >> $env:GITHUB_OUTPUT
            "test=$($test.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "project=$env:PROJECT" >> $env:GITHUB_OUTPUT
            "policy=$env:POLICY" >> $env:GITHUB_OUTPUT
            Write-Host "Signatur über SignPath: Projekt $env:PROJECT, Richtlinie $env:POLICY$(if ($test) { ' (Probelauf, nichts ans Release)' })."
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            "test=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice title=Installer unsigniert::SIGNPATH_API_TOKEN oder SIGNPATH_ORGANIZATION_ID fehlt — der Windows-Installer wird nicht signiert (SmartScreen warnt beim Benutzer). Einrichtung: RELEASING.md."
          }

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-09
        with:
          toolchain: stable

      # Nur lesen: Tags sollen keinen eigenen Cache anlegen (gespeichert wird von windows.yml auf main).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: windows
          save-if: false

      # Nur für diesen Build, wird nicht eingecheckt (im Repo steht die zuletzt eingecheckte Version).
      - name: Version in package.json, tauri.conf.json und Cargo.toml setzen
        run: node scripts/set-version.mjs ${{ steps.version.outputs.version }}

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      - name: App und Installer bauen (Weitergabe, ohne Entwickler-Code)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Fest einkompiliert (option_env!), z. B. für die Nutzungsstatistik — sonst meldet Windows Build 0.
          KNIPS_BUILD: ${{ steps.version.outputs.build }}
        run: |
          pnpm tauri build
          if ($LASTEXITCODE -ne 0) { throw "tauri build fehlgeschlagen ($LASTEXITCODE)" }
          $exe = @(Get-ChildItem target/release/bundle/nsis -Filter "Knips_$($env:VERSION)_x64-setup.exe")
          if ($exe.Count -ne 1) { throw "Erwartet genau einen Installer für $($env:VERSION), gefunden: $($exe.Count)" }
          $info = (Get-Item target/release/knips.exe).VersionInfo
          Write-Host "knips.exe: ProductName '$($info.ProductName)', ProductVersion '$($info.ProductVersion)'"
          if ($info.ProductName -ne 'Knips' -or $info.ProductVersion -ne $env:VERSION) { throw "Metadaten von knips.exe passen nicht (SignPath verlangt sie)." }

      - name: App-EXE für SignPath hochladen
        id: upload-exe
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knips-exe-unsigned
          path: windows/target/release/knips.exe
          if-no-files-found: error
          retention-days: 7

      # Ohne Signatur ist das schon das Ergebnis; mit Signatur nur zum Vergleich.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-unsigned
          path: windows/target/release/bundle/nsis/Knips_${{ steps.version.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  sign-app:
    needs: windows
    if: needs.windows.outputs.signing == 'true'
    runs-on: ubuntu-latest
    # Wartet auf die Freigabe in SignPath (höchstens eine Stunde).
    timeout-minutes: 70
    permissions:
      actions: read     # SignPath liest Lauf-Details und lädt das Artefakt
      contents: read
    steps:
      - name: knips.exe signieren (SignPath, Freigabe in app.signpath.io)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ needs.windows.outputs.project }}
          signing-policy-slug: ${{ needs.windows.outputs.policy }}
          artifact-configuration-slug: knips-exe
          github-artifact-id: ${{ needs.windows.outputs.exe-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed
          parameters: |
            version: "${{ needs.windows.outputs.version }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knips-exe-signed
          path: ${{ runner.temp }}/signed/knips.exe
          if-no-files-found: error
          retention-days: 7

  bundle:
    needs: [windows, sign-app]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      installer-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      # Kein Kompilieren hier; die Tauri-CLI liest nur die Cargo-Metadaten.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-09
        with:
          toolchain: stable

      - name: Version setzen
        run: node scripts/set-version.mjs ${{ needs.windows.outputs.version }}

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: knips-exe-signed
          path: ${{ runner.temp }}/signed

      - name: Installer um die signierte knips.exe bauen
        id: bundle
        env:
          VERSION: ${{ needs.windows.outputs.version }}
          TEST_SIGNING: ${{ needs.windows.outputs.test-signing }}
          SIGNED: ${{ runner.temp }}/signed/knips.exe
        run: |
          $setup = ./scripts/bundle-signed.ps1 -SignedExe $env:SIGNED -Version $env:VERSION -AllowUntrustedRoot:($env:TEST_SIGNING -eq 'true')
          $rel = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $setup) -replace '\\', '/'
          "path=$rel" >> $env:GITHUB_OUTPUT

      - name: Installer für SignPath hochladen
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-to-sign
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  sign-installer:
    needs: [windows, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    steps:
      - name: Installer signieren (SignPath, zweite Freigabe)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ needs.windows.outputs.project }}
          signing-policy-slug: ${{ needs.windows.outputs.policy }}
          artifact-configuration-slug: knips-installer
          github-artifact-id: ${{ needs.bundle.outputs.installer-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed
          parameters: |
            version: "${{ needs.windows.outputs.version }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-signed
          path: ${{ runner.temp }}/signed/Knips_${{ needs.windows.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  # Updater-Signatur über genau die Datei, die ins Release kommt (unsigniert: aus „windows“, sonst aus
  # „sign-installer“), und latest.json dazu. Prüft gegen den öffentlichen Schlüssel aus tauri.conf.json des Tags.
  updater:
    needs: [windows, sign-installer]
    # Unsigniert: direkt nach dem Bauen. Signiert: erst wenn auch der Installer signiert ist.
    if: >-
      !cancelled() && needs.windows.result == 'success' &&
      (needs.windows.outputs.signing == 'true' && needs.sign-installer.result == 'success' ||
       needs.windows.outputs.signing != 'true' && needs.sign-installer.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      # Für `tauri signer sign` (Tauri-CLI aus dem Lockfile).
      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows.outputs.signing == 'true' && 'installer-signed' || 'installer-unsigned' }}
          path: ${{ runner.temp }}/release

      - name: Updater-Signatur und latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.windows.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "release/Knips_$($env:VERSION)_x64-setup.exe"
          $url = "https://github.com/$env:REPO/releases/download/$env:TAG/Knips_$($env:VERSION)_x64-setup.exe"
          $notes = "Knips $($env:VERSION): https://github.com/$env:REPO/releases/tag/$env:TAG"
          ./scripts/update-feed.ps1 -Installer $exe -Version $env:VERSION -Url $url -Notes $notes -Out (Join-Path $env:RUNNER_TEMP "feed/latest.json")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-feed
          path: ${{ runner.temp }}/feed/latest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [windows, sign-installer, updater]
    if: ${{ !cancelled() && needs.updater.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write   # Release-Entwurf anlegen und Dateien anhängen
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows.outputs.signing == 'true' && 'installer-signed' || 'installer-unsigned' }}
          path: ${{ runner.temp }}/release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-feed
          path: ${{ runner.temp }}/release

      # Nur für scripts/update-feed.mjs (ohne Abhängigkeiten).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Signatur und Prüfsumme
        id: files
        env:
          VERSION: ${{ needs.windows.outputs.version }}
          SIGNING: ${{ needs.windows.outputs.signing }}
          TEST_SIGNING: ${{ needs.windows.outputs.test-signing }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "release/Knips_$($env:VERSION)_x64-setup.exe"
          if (-not (Test-Path $exe)) { throw "$exe fehlt." }
          if ($env:SIGNING -eq 'true') {
            # Installer und die knips.exe darin: gültig signiert, vom selben Zertifikat, Metadaten wie verlangt.
            ./scripts/check-signature.ps1 -Path $exe -Version $env:VERSION -Installer -AllowUntrustedRoot:($env:TEST_SIGNING -eq 'true')
          } else {
            $status = (Get-AuthenticodeSignature $exe).Status
            Write-Host "Installer unsigniert ($status)."
          }
          # latest.json gehört zu genau dieser Datei: Updater-Signatur, Version und Adresse, geprüft mit dem
          # öffentlichen Schlüssel aus tauri.conf.json des Tags (den die installierten Fassungen auch haben).
          node scripts/update-feed.mjs --check (Join-Path $env:RUNNER_TEMP "release/latest.json") --installer $exe
          if ($LASTEXITCODE -ne 0) { throw "latest.json passt nicht zum Installer." }
          $feed = Get-Content -Raw (Join-Path $env:RUNNER_TEMP "release/latest.json") | ConvertFrom-Json
          if ($feed.version -ne $env:VERSION) { throw "latest.json nennt Version $($feed.version) statt $($env:VERSION)." }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          # Format wie `shasum -a 256`, damit `shasum -c` und Get-FileHash beide passen.
          [IO.File]::WriteAllText("$exe.sha256", "$hash  $([IO.Path]::GetFileName($exe))`n")
          "exe=$($exe -replace '\\', '/')" >> $env:GITHUB_OUTPUT
          Write-Host "$([IO.Path]::GetFileName($exe))  $hash"

      - name: An das Release hängen
        if: needs.windows.outputs.test-signing != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXE: ${{ steps.files.outputs.exe }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Kein Release für $TAG — lege einen Entwurf an."
            gh release create "$TAG" --draft --verify-tag --title "Knips $VERSION" \
              --notes "Entwurf. Das macOS-DMG und der Release-Text kommen über scripts/release.sh dazu."
          fi
          # latest.json: Feed der automatischen Aktualisierung (releases/latest/download/latest.json). Zählt erst,
          # wenn das Release veröffentlicht ist — Entwürfe sind für GitHub nie „latest“.
          gh release upload "$TAG" "$EXE" "$EXE.sha256" "$(dirname "$EXE")/latest.json" --clobber
          gh release view "$TAG" --json isDraft,assets --jq '"Entwurf: \(.isDraft)", (.assets[].name)'

      - name: Probelauf mit Testzertifikat
        if: needs.windows.outputs.test-signing == 'true'
        run: Write-Host "::notice title=Probelauf::Mit der Richtlinie '${{ needs.windows.outputs.policy }}' signiert — nicht ans Release gehängt. Ergebnis im Artefakt dieses Laufs."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knips-windows-${{ needs.windows.outputs.version }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
