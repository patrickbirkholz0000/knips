# Knips-Telemetrie. Eingerichtet über die Cloudflare-API; diese Datei hält dieselbe Konfiguration fest,
# damit `npx wrangler deploy` (aus diesem Ordner) dasselbe Ergebnis liefert.
name = "knips-telemetry"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Nur über die eigene Domain erreichbar, nicht über workers.dev.
workers_dev = false
preview_urls = false
routes = [{ pattern = "knips.velno.ai", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "knips-telemetry"
database_id = "22927ad7-c409-446a-ae93-89b45d02f7d7"

# Täglich 03:30 UTC: Daten älter als 400 Tage löschen.
[triggers]
crons = ["30 3 * * *"]

# Keine Workers Logs: sie würden IP-Adressen mitschreiben.
[observability]
enabled = false

# GET /install.ps1: Das Installationsskript kommt beim Bündeln als Text aus ../windows/install.ps1 —
# eine Fassung im Repo, keine Kopie hier.
[[rules]]
type = "Text"
globs = ["**/*.ps1"]
fallthrough = false

# Ratenbegrenzung je IP-Adresse (Rate-Limiting-Binding). Die Adresse ist nur der Schlüssel im flüchtigen Zähler
# von Cloudflare, je Standort, höchstens eine Minute; der Worker speichert oder loggt sie nicht.
# namespace_id: frei gewählte, im Cloudflare-Konto eindeutige Zahl.
# /v1/ping: 10 Pings pro Minute (darüber 429, die Apps senden später erneut).
[[ratelimits]]
name = "PING_LIMITER"
namespace_id = "47011"

  [ratelimits.simple]
  limit = 10
  period = 60

# /stats: 10 Anfragen mit Zugangsdaten pro Minute (darüber 429).
[[ratelimits]]
name = "STATS_LIMITER"
namespace_id = "47012"

  [ratelimits.simple]
  limit = 10
  period = 60

# Secrets (nicht im Repo): SALT und STATS_PASSWORD
#   npx wrangler secret put SALT
#   npx wrangler secret put STATS_PASSWORD
