[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Patrick Birkholz"]
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
anyhow = "1"
log = "0.4"
regex = "1"
parking_lot = "0.12"
gif = "0.14"
color_quant = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

# Bildverarbeitung (Zusammensetzen, Verpixeln, Texterkennung-Vorbereitung) auch im Debug-Build schnell.
[profile.dev.package."*"]
opt-level = 2
