[package]
name = "knips"
description = "Knips — Screenshots und Bildschirmaufnahmen mit Zensur (Windows)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
default-run = "knips"

[[bin]]
name = "knips"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
knips-core = { path = "../crates/core" }
knips-platform = { path = "../crates/platform" }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# Ohne Feature `deep-link`: Der Rückruf reicht die Argumente selbst an das Deep-Link-Plugin weiter
# (`app::second_instance`). Mit dem Feature täte das Plugin es zusätzlich — jeder Link liefe doppelt.
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
# Automatische Aktualisierung (MIT/Apache-2.0): Feed, Signatur, Versionsvergleich, Installer. TLS über das System
# (Windows: SChannel) wie die Nutzungsstatistik — kein C-Code, der Windows-Check auf dem Mac bleibt möglich.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
drag = "2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
image.workspace = true
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
chrono.workspace = true
dirs = "7"
# Nutzungsstatistik: kleiner blockierender HTTP-Client; TLS über das System (Windows: SChannel),
# kein C-Code — der Windows-Check auf dem Mac bleibt möglich.
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[features]
default = []
# Oberfläche aus der eingebauten Seite statt vom Entwicklungsserver (setzt `pnpm tauri build` selbst;
# bei `cargo build` angeben).
custom-protocol = ["tauri/custom-protocol"]
# Selbsttests und Test-Befehle (wie KNIPS_DEV auf dem Mac). Weitergabe-Builds ohne.
dev = ["knips-platform/dev"]
