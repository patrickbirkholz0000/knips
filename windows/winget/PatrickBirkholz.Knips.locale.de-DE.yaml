ShortDescription: Screenshots und Bildschirmvideos mit Zensur für Bilder und Videos. Ohne Konto, alles bleibt auf dem Rechner.
Description: |-
  Knips nimmt einen Bereich, ein Fenster oder den ganzen Bildschirm auf, auch als Scroll-Screenshot oder als
  MP4-Video. Im Editor kommen Pfeile, Text, Nummern und Markierungen dazu, und sensible Stellen lassen sich
  zensieren: als Balken, verpixelt oder unscharf, auf Wunsch automatisch für E-Mail-Adressen, IBANs,
  Telefonnummern und API-Schlüssel (Texterkennung auf dem Gerät). Das geht auch in Videos, mit Balken, die
  bewegtem Inhalt folgen. Gespeichert und geteilt wird immer die zensierte Fassung.

  Freie Software (GPL-3.0-or-later), ohne Konto und ohne Cloud. Eine anonyme Nutzungsstatistik sendet Knips
  nur, wenn man beim ersten Start zustimmt. Die Oberfläche ist auf Deutsch.
