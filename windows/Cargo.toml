[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "src-tauri"]

[workspace.package]
version = "1.0.1"
edition = "2021"
authors = ["Patrick Birkholz <kontakt@birkgroup.de>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/patrickbirkholz0000/knips"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
anyhow = "1"
log = "0.4"
regex = "1"
parking_lot = "0.12"
gif = "0.14"
color_quant = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

# Selbsttest-Fassung in der CI: optimiert, aber ohne LTO (baut deutlich schneller).
[profile.selftest]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# Bildverarbeitung (Zusammensetzen, Verpixeln, Texterkennung-Vorbereitung) auch im Debug-Build schnell.
[profile.dev.package."*"]
opt-level = 2
