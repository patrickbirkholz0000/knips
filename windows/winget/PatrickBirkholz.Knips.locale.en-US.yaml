ShortDescription: Screenshots and screen recordings with censoring for images and videos. No account, everything stays on your PC.
Description: |-
  Knips captures an area, a window or the whole screen, scrolling screenshots and MP4 screen recordings. The
  editor adds arrows, text, numbers and highlights and censors sensitive content with solid bars, pixelation
  or blur, optionally automatically for e-mail addresses, IBANs, phone numbers and API keys (on-device text
  recognition). This works in videos too, with bars that follow moving content. Saved and shared files are
  always the censored version.

  Free software (GPL-3.0-or-later), no account, no cloud. Anonymous usage statistics are only sent if you
  agree on first launch. The user interface is in German.
