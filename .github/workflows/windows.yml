# Windows-Fassung bauen und auf einem echten Windows prüfen: Kern-Tests, Selbsttests (mit Bildern der eigenen
# Fenster), Installer, Installation per install.ps1, automatische Aktualisierung von Ende zu Ende (zwei echte
# Installer, Feed auf 127.0.0.1). Ergebnisse als Artefakt „knips-windows“.
# Zweiter Job „signatur“: der Signatur-Ablauf aus release.yml (App-EXE signieren → Installer neu bündeln →
# Installer signieren → Updater-Signatur und latest.json) mit Wegwerf-Zertifikat und -Schlüssel statt SignPath und
# Secret.
#
# Drittanbieter-Actions sind auf Commit-SHAs festgelegt (Version im Kommentar); Dependabot hält sie aktuell.
name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      selbsttests:
        description: "Nur diese Selbsttests (z. B. „selection firstshot ui“), ohne Installer — leer = alles; „update“ auch mit dem Ende-zu-Ende-Test der Aktualisierung"
        required: false
        default: ""

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-09
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: windows
          cache-on-failure: true

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      # Die Lizenzseite des Installers zeigt erst den Datenschutzhinweis, dann die GPL: der Rest der Datei muss
      # genau der Lizenztext sein.
      - name: Installer-Text (Datenschutz + Lizenz)
        run: |
          $text = [IO.File]::ReadAllBytes("installer/datenschutz-und-lizenz.txt")
          $gpl = [IO.File]::ReadAllBytes("LICENSE")
          $tail = $text[($text.Length - $gpl.Length)..($text.Length - 1)]
          if ([Convert]::ToBase64String($tail) -ne [Convert]::ToBase64String($gpl)) {
            throw "installer/datenschutz-und-lizenz.txt endet nicht mit dem Text aus LICENSE."
          }
          Write-Host "Datenschutzhinweis + vollständige GPL ($($gpl.Length) Bytes)"

      - name: Oberfläche (Typprüfung + Build)
        run: pnpm build

      - name: Kern-Tests
        run: cargo test -p knips-core

      # Die Texterkennung nimmt die Sprache des Benutzerprofils (auf dem Runner en-US); das deutsche
      # Paket nachzuinstallieren kostete 18 Minuten und wurde nie benutzt.
      - name: Texterkennung (Sprachpaket) und Media Foundation
        continue-on-error: true
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0" | Out-String | Write-Host
          Get-WindowsFeature Server-Media-Foundation | Out-String | Write-Host
          Install-WindowsFeature Server-Media-Foundation | Out-String | Write-Host

      - name: Selbsttest-Build (mit Entwickler-Code)
        id: selftest-build
        run: cargo build --profile selftest -p knips --features dev,custom-protocol

      - name: Selbsttests
        env:
          SELBSTTESTS: ${{ inputs.selbsttests }}
        run: |
          if ($env:SELBSTTESTS) {
            ./scripts/selftest.ps1 -Exe target/selftest/knips.exe -Out shots -Tests $env:SELBSTTESTS
          } else {
            ./scripts/selftest.ps1 -Exe target/selftest/knips.exe -Out shots
          }

      - name: Installer (Weitergabe, ohne Entwickler-Code)
        id: installer
        if: always() && !inputs.selbsttests
        run: pnpm tauri build

      # Installiert wirklich (PowerShell 7 und Windows PowerShell 5.1) und deinstalliert wieder.
      - name: Installation per install.ps1
        if: always() && steps.installer.outcome == 'success'
        run: |
          $setup = @(Get-ChildItem target/release/bundle/nsis -Filter "*_x64-setup.exe")
          if ($setup.Count -ne 1) { throw "Erwartet genau einen Installer, gefunden: $($setup.Count)" }
          ./scripts/test-install.ps1 -Installer $setup[0].FullName

      # Still deinstallieren ohne und mit „App-Daten löschen“ (/DELETEAPPDATA): Ordner, Registry, Druck-Taste.
      - name: Deinstallation (Daten, Druck-Taste)
        if: always() && steps.installer.outcome == 'success'
        run: |
          $setup = @(Get-ChildItem target/release/bundle/nsis -Filter "*_x64-setup.exe")
          if ($setup.Count -ne 1) { throw "Erwartet genau einen Installer, gefunden: $($setup.Count)" }
          ./scripts/uninstall-test.ps1 -Setup $setup[0].FullName -Out shots/uninstall

      # Automatische Aktualisierung von Ende zu Ende: zwei Entwickler-Installer 0.0.1 und 0.0.2 (Profil selftest, nur
      # die App wird neu gebaut) mit Wegwerf-Updater-Schlüssel, Feed auf 127.0.0.1, echte Installation über den
      # Updater, Gegenproben. Einzeln: -f selbsttests="update" (dazu der Selbsttest `update`).
      - name: Aktualisierung (Ende zu Ende)
        if: always() && steps.selftest-build.outcome == 'success' && (!inputs.selbsttests || contains(inputs.selbsttests, 'update'))
        run: ./scripts/update-test.ps1 -Out shots/aktualisierung

      - name: Installer-Seiten fotografieren
        if: always() && steps.installer.outcome == 'success'
        continue-on-error: true
        run: |
          $setup = @(Get-ChildItem target/release/bundle/nsis -Filter "*_x64-setup.exe")[0]
          ./scripts/installer-shots.ps1 -Installer $setup.FullName -Out shots/installer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: knips-windows
          path: |
            windows/shots
            windows/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # Für den Job „signatur“: die App-EXE genau so, wie release.yml sie zu SignPath schickt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.installer.outcome == 'success'
        with:
          name: knips-exe
          path: windows/target/release/knips.exe
          if-no-files-found: error
          retention-days: 3

  # Signatur-Ablauf aus release.yml in einem frischen Job (wie dort zwischen Bauen und Signieren), mit einem
  # selbst ausgestellten Zertifikat, das nur auf diesem Runner gilt.
  signatur:
    needs: windows
    if: ${{ !inputs.selbsttests }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-09
        with:
          toolchain: stable

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: knips-exe
          path: ${{ runner.temp }}/unsigned

      - name: Wegwerf-Zertifikat
        id: cert
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Knips CI Signatur-Probe" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddDays(1)
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "version=$((Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT

      - name: App-EXE signieren (an Stelle von SignPath)
        env:
          THUMB: ${{ steps.cert.outputs.thumbprint }}
          VERSION: ${{ steps.cert.outputs.version }}
          UNSIGNED: ${{ runner.temp }}/unsigned/knips.exe
          SIGNED: ${{ runner.temp }}/signed/knips.exe
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:THUMB"
          New-Item -ItemType Directory -Force -Path (Split-Path $env:SIGNED) | Out-Null
          Copy-Item $env:UNSIGNED $env:SIGNED
          Set-AuthenticodeSignature -FilePath $env:SIGNED -Certificate $cert -HashAlgorithm SHA256 | Format-List Status, StatusMessage
          # Zertifikat ohne vertraute Wurzel (wie SignPaths Testzertifikat): nur mit -AllowUntrustedRoot gültig.
          ./scripts/check-signature.ps1 -Path $env:SIGNED -Version $env:VERSION -Thumbprint $env:THUMB -AllowUntrustedRoot
          $strict = $true
          try { ./scripts/check-signature.ps1 -Path $env:SIGNED -Version $env:VERSION | Out-Null } catch { $strict = $false }
          if ($strict) { throw "Ohne vertraute Wurzel hätte die strenge Prüfung scheitern müssen." }
          # Ab hier wie ein öffentliches Zertifikat: Wurzel nur auf diesem Runner vertrauen.
          $cer = Join-Path $env:RUNNER_TEMP probe.cer
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          ./scripts/check-signature.ps1 -Path $env:SIGNED -Version $env:VERSION -Thumbprint $env:THUMB

      - name: Installer um die signierte App bündeln (wie release.yml)
        id: bundle
        env:
          THUMB: ${{ steps.cert.outputs.thumbprint }}
          VERSION: ${{ steps.cert.outputs.version }}
          SIGNED: ${{ runner.temp }}/signed/knips.exe
        run: |
          $setup = ./scripts/bundle-signed.ps1 -SignedExe $env:SIGNED -Version $env:VERSION -Thumbprint $env:THUMB
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Installer signieren und prüfen
        env:
          THUMB: ${{ steps.cert.outputs.thumbprint }}
          VERSION: ${{ steps.cert.outputs.version }}
          SETUP: ${{ steps.bundle.outputs.setup }}
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:THUMB"
          Set-AuthenticodeSignature -FilePath $env:SETUP -Certificate $cert -HashAlgorithm SHA256 | Format-List Status, StatusMessage
          ./scripts/check-signature.ps1 -Path $env:SETUP -Version $env:VERSION -Thumbprint $env:THUMB -Installer

      - name: install.ps1 mit signiertem Installer
        env:
          THUMB: ${{ steps.cert.outputs.thumbprint }}
          SETUP: ${{ steps.bundle.outputs.setup }}
        run: ./scripts/test-install.ps1 -Installer $env:SETUP -ProbeThumbprint $env:THUMB

      # Wie der Job „updater“ in release.yml (scripts/update-feed.ps1) über den fertig signierten Installer, mit einem
      # Wegwerf-Schlüssel statt des Secrets: Updater-Signatur, latest.json, Prüfung mit dem öffentlichen Schlüssel.
      # Gegenproben: ohne Schlüssel Abbruch mit Grund, veränderter Installer und fremder Schlüssel abgelehnt.
      - name: Updater-Signatur und latest.json (wie release.yml)
        env:
          VERSION: ${{ steps.cert.outputs.version }}
          SETUP: ${{ steps.bundle.outputs.setup }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP "updater"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $tag = "v$env:VERSION"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Knips_$($env:VERSION)_x64-setup.exe"
          $notes = "Knips $($env:VERSION): https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
          $feed = Join-Path $work "latest.json"
          # Wegwerf-Schlüssel mit Passwort; das Passwort steht nur in der Umgebung, wie das Secret in release.yml.
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          node -e "require('@tauri-apps/cli').run(['signer', 'generate', '--ci', '-w', process.argv[1], '-p', process.env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD], 'tauri').catch((e) => { console.error(String(e)); process.exit(1); })" "$work/probe.key" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Wegwerf-Schlüssel nicht erzeugt" }
          $pub = (Get-Content -Raw "$work/probe.key.pub").Trim()

          # Fehlt das Secret, bricht das Signieren mit Grund ab.
          $missing = $null
          try { ./scripts/update-feed.ps1 -Installer $env:SETUP -Version $env:VERSION -Url $url -Out $feed -PubKey $pub } catch { $missing = $_.Exception.Message }
          if ($missing -notmatch "TAURI_SIGNING_PRIVATE_KEY fehlt") { throw "Ohne Schlüssel hätte update-feed.ps1 mit Grund abbrechen müssen: $missing" }
          Write-Host "Ohne Schlüssel: $missing"

          $hash = (Get-FileHash -Algorithm SHA256 $env:SETUP).Hash
          $env:TAURI_SIGNING_PRIVATE_KEY = (Get-Content -Raw "$work/probe.key").Trim()
          ./scripts/update-feed.ps1 -Installer $env:SETUP -Version $env:VERSION -Url $url -Out $feed -PubKey $pub -Notes $notes
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY, Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          Get-Content $feed | Write-Host
          if ((Get-FileHash -Algorithm SHA256 $env:SETUP).Hash -ne $hash) { throw "Die Updater-Signatur hat den Installer verändert." }
          $sig = Get-AuthenticodeSignature -LiteralPath $env:SETUP
          if ($sig.Status -ne "Valid") { throw "Authenticode-Signatur nach der Updater-Signatur: $($sig.Status)" }
          $json = Get-Content -Raw $feed | ConvertFrom-Json
          if ($json.version -ne $env:VERSION -or $json.platforms."windows-x86_64".url -ne $url -or $json.notes -ne $notes) { throw "latest.json hat nicht die erwartete Form." }
          node scripts/update-feed.mjs --check $feed --installer $env:SETUP --pubkey $pub
          if ($LASTEXITCODE -ne 0) { throw "latest.json besteht die Prüfung nicht." }

          # Gegenproben: veränderter Installer (gleicher Name) und der Release-Schlüssel aus tauri.conf.json (fremd).
          $copyDir = Join-Path $work "manipuliert"
          New-Item -ItemType Directory -Force -Path $copyDir | Out-Null
          $copy = Join-Path $copyDir (Split-Path -Leaf $env:SETUP)
          $bytes = [IO.File]::ReadAllBytes($env:SETUP)
          $bytes[[int]($bytes.Length / 2)] = $bytes[[int]($bytes.Length / 2)] -bxor 0xFF
          [IO.File]::WriteAllBytes($copy, $bytes)
          node scripts/update-feed.mjs --check $feed --installer $copy --pubkey $pub
          if ($LASTEXITCODE -eq 0) { throw "Veränderter Installer hätte abgelehnt werden müssen." }
          node scripts/update-feed.mjs --check $feed --installer $env:SETUP
          if ($LASTEXITCODE -eq 0) { throw "Mit fremdem Schlüssel (tauri.conf.json) hätte die Prüfung scheitern müssen." }
          Write-Host "Gegenproben abgelehnt (veränderter Installer, fremder Schlüssel)."
          exit 0

      - name: Zertifikat entfernen
        if: always() && steps.cert.outputs.thumbprint != ''
        env:
          THUMB: ${{ steps.cert.outputs.thumbprint }}
        run: |
          Remove-Item "Cert:\LocalMachine\Root\$env:THUMB" -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\My\$env:THUMB" -ErrorAction SilentlyContinue
